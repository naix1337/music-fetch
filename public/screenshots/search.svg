<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#0f172a"/>
  <!-- Gradient blobs -->
  <ellipse cx="200" cy="100" rx="400" ry="300" fill="rgba(99,102,241,0.08)" filter="url(#blur1)"/>
  <ellipse cx="1000" cy="650" rx="350" ry="250" fill="rgba(6,182,212,0.06)" filter="url(#blur2)"/>
  <defs>
    <filter id="blur1"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>
  <!-- Grid pattern -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="rgba(255,255,255,0.02)" stroke-width="64"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="rgba(255,255,255,0.02)" stroke-width="64"/>
  <!-- Stars -->
  <circle cx="150" cy="80" r="1" fill="white" opacity="0.4"/>
  <circle cx="350" cy="40" r="1.5" fill="#93c5fd" opacity="0.5"/>
  <circle cx="600" cy="120" r="1" fill="white" opacity="0.3"/>
  <circle cx="850" cy="60" r="2" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="1050" cy="100" r="1" fill="#67e8f9" opacity="0.5"/>
  <circle cx="200" cy="180" r="1" fill="white" opacity="0.3"/>
  <circle cx="450" cy="90" r="1.5" fill="#93c5fd" opacity="0.4"/>
  <circle cx="700" cy="50" r="1" fill="white" opacity="0.5"/>
  <circle cx="950" cy="140" r="1.5" fill="#c4b5fd" opacity="0.3"/>
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="rgba(0,0,0,0.2)" style="backdrop-filter: blur(20px)"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="rgba(255,255,255,0.06)"/>
  <line x1="0" y1="61" x2="1200" y2="61" stroke="url(#gradientLine)"/>
  <defs>
    <linearGradient id="gradientLine" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(99,102,241,0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <!-- Logo placeholder -->
  <rect x="20" y="14" width="32" height="32" rx="8" fill="rgba(99,102,241,0.2)" stroke="rgba(255,255,255,0.08)"/>
  <text x="28" y="35" font-family="sans-serif" font-size="16" fill="#818cf8">♪</text>
  <text x="62" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="url(#titleGrad)">MusicFetch</text>
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="200" y2="0">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#f4f4f5"/>
    </linearGradient>
  </defs>
  <!-- Equalizer bars -->
  <rect x="155" y="22" width="3" height="6" rx="1.5" fill="url(#eqGrad)" opacity="0.8"/>
  <rect x="161" y="18" width="3" height="14" rx="1.5" fill="url(#eqGrad)" opacity="0.9"/>
  <rect x="167" y="24" width="3" height="4" rx="1.5" fill="url(#eqGrad)" opacity="0.7"/>
  <rect x="173" y="20" width="3" height="12" rx="1.5" fill="url(#eqGrad)" opacity="0.85"/>
  <rect x="179" y="22" width="3" height="8" rx="1.5" fill="url(#eqGrad)" opacity="0.75"/>
  <defs>
    <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <!-- Tab Navigation -->
  <rect x="900" y="12" width="280" height="36" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
  <!-- Search tab active -->
  <rect x="902" y="14" width="90" height="32" rx="8" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
  <text x="925" y="35" font-family="sans-serif" font-size="13" fill="#a5b4fc">🔍 Suchen</text>
  <rect x="994" y="14" width="90" height="32" rx="8" fill="none"/>
  <text x="1015" y="35" font-family="sans-serif" font-size="13" fill="#94a3b8">📋 Playlists</text>
  <rect x="1086" y="14" width="90" height="32" rx="8" fill="none"/>
  <text x="1105" y="35" font-family="sans-serif" font-size="13" fill="#94a3b8">📚 Bibliothek</text>
  <!-- Search section -->
  <rect x="40" y="90" width="1120" height="620" rx="0" fill="none"/>
  <!-- Search input -->
  <rect x="40" y="100" width="860" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="65" y="132" font-family="sans-serif" font-size="15" fill="#64748b">🔍 Song, Künstler oder Album...</text>
  <!-- Search button -->
  <rect x="920" y="100" width="240" height="50" rx="12" fill="url(#searchBtn)"/>
  <defs>
    <linearGradient id="searchBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <text x="1020" y="132" font-family="sans-serif" font-size="15" font-weight="600" fill="white" text-anchor="middle">🔍 Suchen</text>
  <!-- Source pills -->
  <rect x="40" y="165" width="90" height="32" rx="16" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)"/>
  <text x="58" y="186" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">YouTube</text>
  <rect x="138" y="165" width="100" height="32" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
  <text x="155" y="186" font-family="sans-serif" font-size="12" fill="#94a3b8">SoundCloud</text>
  <rect x="246" y="165" width="90" height="32" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
  <text x="263" y="186" font-family="sans-serif" font-size="12" fill="#94a3b8">Bandcamp</text>
  <rect x="344" y="165" width="80" height="32" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
  <text x="358" y="186" font-family="sans-serif" font-size="12" fill="#94a3b8">Vimeo</text>
  <!-- Results -->
  <rect x="40" y="220" width="1120" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <rect x="60" y="240" width="40" height="40" rx="8" fill="rgba(255,255,255,0.05)"/>
  <text x="68" y="265" font-family="sans-serif" font-size="16" fill="#64748b">♪</text>
  <text x="120" y="258" font-family="sans-serif" font-size="14" font-weight="600" fill="#f4f4f5">In The End - Linkin Park</text>
  <text x="120" y="278" font-family="sans-serif" font-size="12" fill="#94a3b8">Linkin Park</text>
  <rect x="850" y="245" width="60" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="858" y="260" font-family="sans-serif" font-size="11" fill="#94a3b8">⏱ 3:36</text>
  <rect x="930" y="240" width="100" height="32" rx="8" fill="rgba(99,102,241,0.2)"/>
  <text x="955" y="260" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">⬇ Download</text>
  <!-- Result 2 -->
  <rect x="40" y="310" width="1120" height="80" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <rect x="60" y="330" width="40" height="40" rx="8" fill="rgba(255,255,255,0.05)"/>
  <text x="68" y="355" font-family="sans-serif" font-size="16" fill="#64748b">♪</text>
  <text x="120" y="348" font-family="sans-serif" font-size="14" font-weight="600" fill="#f4f4f5">Numb - Linkin Park</text>
  <text x="120" y="368" font-family="sans-serif" font-size="12" fill="#94a3b8">Linkin Park</text>
  <rect x="850" y="335" width="60" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="858" y="350" font-family="sans-serif" font-size="11" fill="#94a3b8">⏱ 3:07</text>
  <rect x="930" y="330" width="100" height="32" rx="8" fill="rgba(99,102,241,0.2)"/>
  <text x="955" y="350" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">⬇ Download</text>
  <!-- Download queue panel -->
  <rect x="800" y="520" width="360" height="200" rx="16" fill="rgba(15,23,42,0.95)" stroke="rgba(255,255,255,0.08)" style="backdrop-filter: blur(20px)"/>
  <text x="820" y="550" font-family="sans-serif" font-size="14" font-weight="600" fill="#f4f4f5">⬇ Downloads</text>
  <!-- Download item 1 -->
  <rect x="815" y="565" width="330" height="60" rx="8" fill="rgba(255,255,255,0.04)"/>
  <circle cx="835" cy="592" r="10" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 835 592" to="360 835 592" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="855" y="588" font-family="sans-serif" font-size="12" font-weight="500" fill="#f4f4f5">In The End - Linkin Park</text>
  <text x="855" y="606" font-family="sans-serif" font-size="11" fill="#818cf8" opacity="0.7">Wird heruntergeladen...</text>
  <rect x="855" y="615" width="275" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="855" y="615" width="180" height="4" rx="2" fill="url(#progressGrad)"/>
  <defs>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Download item 2 completed -->
  <rect x="815" y="635" width="330" height="60" rx="8" fill="rgba(255,255,255,0.03)"/>
  <circle cx="835" cy="662" r="10" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M830 662l4 4 8-8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <text x="855" y="658" font-family="sans-serif" font-size="12" font-weight="500" fill="#f4f4f5" opacity="0.7">Numb - Linkin Park</text>
  <text x="855" y="676" font-family="sans-serif" font-size="11" fill="#34d399" opacity="0.7">✅ Download abgeschlossen</text>
</svg>
