  <circle cx="835" cy="662" r="10" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M830 662l4 4 8-8" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <text x="855" y="658" font-family="sans-serif" font-size="12" font-weight="500" fill="#f4f4f5" opacity="0.7">Numb - Linkin Park</text>
