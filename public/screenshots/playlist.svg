  <text x="855" y="588" font-family="sans-serif" font-size="12" font-weight="500" fill="#f4f4f5">In The End - Linkin Park</text>
  <text x="855" y="606" font-family="sans-serif" font-size="11" fill="#818cf8" opacity="0.7">Wird heruntergeladen...</text>
  <rect x="855" y="615" width="275" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
