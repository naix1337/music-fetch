  <rect x="40" y="414" width="1120" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="444" font-family="sans-serif" font-size="12" fill="#475569" font-weight="600">04</text>
  <text x="90" y="441" font-family="sans-serif" font-size="13" font-weight="500" fill="#f4f4f5">Faint</text>
  <text x="90" y="457" font-family="sans-serif" font-size="11" fill="#94a3b8">Linkin Park</text>
  <text x="820" y="449" font-family="sans-serif" font-size="11" fill="#64748b">2:42</text>
  <rect x="860" y="429" width="36" height="30" rx="6" fill="rgba(99,102,241,0.2)"/>
