  <text x="90" y="321" font-family="sans-serif" font-size="11" fill="#94a3b8">Linkin Park</text>
  <text x="820" y="313" font-family="sans-serif" font-size="11" fill="#64748b">3:07</text>
  <rect x="860" y="293" width="36" height="30" rx="6" fill="rgba(99,102,241,0.2)"/>
