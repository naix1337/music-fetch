  <rect x="40" y="346" width="1120" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="376" font-family="sans-serif" font-size="12" fill="#475569" font-weight="600">03</text>
  <text x="90" y="373" font-family="sans-serif" font-size="13" font-weight="500" fill="#f4f4f5">Somewhere I Belong</text>
  <text x="90" y="389" font-family="sans-serif" font-size="11" fill="#94a3b8">Linkin Park</text>
  <text x="820" y="381" font-family="sans-serif" font-size="11" fill="#64748b">3:33</text>
  <rect x="860" y="361" width="36" height="30" rx="6" fill="rgba(99,102,241,0.2)"/>
